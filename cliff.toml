# git-cliff: the next semantic version and the release notes, for .github/workflows/release_tag.yml.
# https://git-cliff.org/docs/configuration
#
# Commits on main follow Conventional Commits (CLAUDE.md, "Commit types"): with squash merges the
# PR title is the commit, and CI checks the title. A breaking change (`feat!: ...`, or a line
# starting `BREAKING CHANGE:`) makes a major release, `feat` a minor one, and every other type a
# patch. Commits from before the repository used Conventional Commits are listed as earlier changes,
# with their full title (a title like "Profiles: ..." would otherwise lose its first word).

[changelog]
header = ""
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{% if group is containing("Earlier") -%}
- {{ commit.raw_message | split(pat="\n") | first | trim }}\
{% else -%}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endif -%}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Keep commits that are not conventional (the history before the convention); they go to the last group.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  # Merge commits (GitHub's test merge on a pull request, or main merged into a branch) are not changes.
  { message = '^Merge ', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^feat', group = '<!-- 0 -->Features' },
  { message = '^fix', group = '<!-- 1 -->Fixes' },
  { message = '^perf', group = '<!-- 2 -->Performance' },
  { message = '^refactor', group = '<!-- 3 -->Refactoring' },
  { message = '^revert', group = '<!-- 4 -->Reverts' },
  { message = '^docs', group = '<!-- 5 -->Documentation' },
  { message = '^test', group = '<!-- 6 -->Tests' },
  { message = '^(build|ci)', group = '<!-- 7 -->CI and build' },
  { message = '^chore', group = '<!-- 8 -->Chores' },
  { message = '.*', group = '<!-- 9 -->Earlier changes' },
]

[bump]
# Semantic versioning: a breaking change bumps major, a feature minor, anything else patch, also
# below 1.0.0. The first release is v1.0.0: the app already runs in production.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
