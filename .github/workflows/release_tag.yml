# release_tag: tag a release of main, build its image and publish its notes. Run it by hand from the
# Actions tab (release_tag, Run workflow), or: gh workflow run release_tag -f bump=auto
#
# The next version follows semantic versioning from the commits since the last vX.Y.Z tag, as
# cliff.toml reads them: a breaking change bumps major, a feature minor, anything else patch. The
# first release is v1.0.0. The bump can also be chosen by hand, or an exact version given.
# With dry_run, it only shows the version and the notes, and builds the image without pushing it.
# Nothing is committed: the notes go into the GitHub release, so protected main needs no push.
#
# The image is built from the commit being tagged by build-image.sh, for arm64 (the Pi) and amd64, and
# pushed to ghcr.io/<owner>/<repository> under the version. Its digest goes into the release notes, and
# ./deploy.sh <version> pulls it, so the Pi does not build. The same commit gives the same digest.
name: release_tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto (from the commits), patch, minor or major"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: "Exact version instead, like v1.4.0 (leave empty to use the bump)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Only show the next version and the notes, and build the image; tag and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; a second run waits instead of racing for the same tag.
concurrency:
  group: release_tag
  cancel-in-progress: false

env:
  GIT_CLIFF_VERSION: "2.14.2"
  NODE_VERSION: 24   # as in process_pr.yml: its brotli makes the copies the image carries

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # to push the tag and create the GitHub release
      packages: write   # to push the image to ghcr.io
    steps:
      - name: Releases come from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are tagged from main. Run this workflow on main, not ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit and tag, to find the last release and what came after it
      - name: git-cliff ${{ env.GIT_CLIFF_VERSION }}
        run: |
          pipx install "git-cliff==${GIT_CLIFF_VERSION}"
          git-cliff --version

      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$last" ] && [ -z "$(git log --format=%H "$last..HEAD")" ]; then
            echo "::error::Nothing to release: main has no commits since $last."
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            next="$VERSION"
          elif [ "$BUMP" = auto ]; then
            next=$(git-cliff --bumped-version)
          else
            next=$(git-cliff --bump "$BUMP" --bumped-version)
          fi
          if ! [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$next' is not a version like v1.2.3."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next is already tagged."
            exit 1
          fi
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$next" | sort -V | tail -1)" != "$next" ]; then
            echo "::error::$next does not come after the last release, $last."
            exit 1
          fi
          echo "last=${last:-none}" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Last release: ${last:-none}. Next: $next."

      - name: Release notes
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git-cliff --unreleased --tag "$NEXT" --strip all > notes.md
          [ -s notes.md ] || { echo "::error::git-cliff wrote no notes."; exit 1; }
          cat notes.md
          {
            echo "# Flowa $NEXT${{ inputs.dry_run && ' (dry run: nothing tagged)' || '' }}"
            echo
            echo "Last release: ${{ steps.next.outputs.last }}"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # The image comes before the tag: a build that fails leaves nothing behind to clean up, and a run
      # started again pushes the same bytes under the same name.
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what process_pr builds and tests with
      # build-image.sh compresses the page's files with brotli before it compiles (brotli.js).
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The commit builds and its tests pass
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build the image
        id: image
        env:
          NEXT: ${{ steps.next.outputs.next }}
          DRY_RUN: ${{ inputs.dry_run }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"   # a registry name is lower case
          # A builder that can push more than one architecture; the default one cannot.
          docker buildx create --name release --driver docker-container --use >/dev/null
          if [ "$DRY_RUN" = true ]; then
            ./build-image.sh "$image" "$NEXT"
            echo "Dry run: the image for $NEXT builds for arm64 and amd64; nothing was pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref=$(./build-image.sh "$image" "$NEXT" --push)
          [[ "$ref" =~ ^$image:$NEXT@sha256:[0-9a-f]{64}$ ]] || { echo "::error::build-image.sh printed '$ref', not $image:$NEXT@sha256:..."; exit 1; }
          # What was pushed says it is this release: the same question deploy.sh asks before starting it.
          says=$(docker run --rm --network none "$ref" -version)
          [ "$says" = "$NEXT" ] || { echo "::error::the pushed image says it is '$says', not $NEXT"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "### Image"
            echo
            echo "\`$ref\` for linux/arm64 and linux/amd64, built from this tag by \`build-image.sh\`."
            echo "\`./deploy.sh $NEXT\` pulls and starts it."
          } | tee -a notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Flowa $NEXT"
          git push origin "refs/tags/$NEXT"
          gh release create "$NEXT" --title "Flowa $NEXT" --notes-file notes.md --verify-tag
