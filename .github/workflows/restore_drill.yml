# restore_drill: once a week, prove that Flowa can come back from its own backup. test/restore.sh
# takes a backup with backup.sh from a database with something in it, restores it with
# backup.sh --restore into an empty one, compares every row, starts the app on it, runs the Go
# database tests against it, and restores the backups of earlier versions kept in testdata/backups.
# A backup that is never restored is only a hope; a drill that fails quietly is no better, so a failed
# run opens an issue (or adds to the one already open) and the next green run closes it.
#
# Run it by hand from the Actions tab (restore_drill, Run workflow), or: gh workflow run restore_drill
# With rehearse_failure the run fails on purpose after the drill, to see the issue being opened.
# process_pr runs the same script as the `restore` suite when a pull request changes what a restore
# depends on. GitHub stops a schedule after 60 days without a commit; a push starts it again.
name: restore_drill

on:
  schedule:
    - cron: "23 4 * * 2"   # Tuesdays at 04:23 UTC, an hour after the Pi's own backup
  workflow_dispatch:
    inputs:
      rehearse_failure:
        description: "Fail on purpose after the drill, to see that a failure opens an issue"
        type: boolean
        default: false

permissions:
  contents: read

# One drill at a time: two would fight over the names of their containers.
concurrency:
  group: restore_drill
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # -e and -o pipefail, so a failure under tee still fails the step

env:
  ISSUE_TITLE: The restore drill failed

jobs:
  drill:
    name: restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # to open, add to and close the issue a failed drill leaves
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what process_pr builds and tests with
      - name: Back up, restore, compare, start the app, run the Go tests
        run: test/restore.sh | tee drill.txt
      - name: Fail on purpose (a rehearsal of the alarm)
        if: ${{ inputs.rehearse_failure }}
        run: |
          echo "::error::Failed on purpose: rehearse_failure was set. The drill itself is above."
          exit 1

      # The open issue with this title, if there is one. Read from the list, not from search: search
      # lags behind by minutes and would let a second issue be opened.
      - name: Tell someone
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REHEARSAL: ${{ inputs.rehearse_failure }}
        run: |
          {
            if [ "$REHEARSAL" = true ]; then
              echo "This is a rehearsal: the run was told to fail on purpose, to show that a failed drill is seen. Nothing is wrong with the backup. The next green run closes this issue."
            else
              echo "The weekly restore drill failed, so today a backup may not be something Flowa can come back from. Until this is closed, do not count on \`./backup.sh --restore\`."
            fi
            echo
            echo "Run: $RUN"
            echo
            echo '```'
            if [ -s drill.txt ]; then grep -E '^(FAIL|SKIP|[0-9]+ passed)' drill.txt | cut -c1-400 || true; else echo "The drill printed nothing: it stopped before its first check. See the run."; fi
            echo '```'
            echo
            echo "To run it here: \`test/restore.sh\` (README, Data). The next green run of \`restore_drill\` closes this issue."
          } > body.md
          n=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --body-file body.md; echo "added to #$n"
          else gh issue create --title "$ISSUE_TITLE" --body-file body.md; fi
      - name: Close the issue of an earlier failure
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --limit 200 --json number,title --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          [ -n "$n" ] || { echo "no open issue from an earlier failure"; exit 0; }
          gh issue close "$n" --reason completed --comment "The drill is green again: $RUN ($(grep -E '^[0-9]+ passed' drill.txt | tail -1))."
