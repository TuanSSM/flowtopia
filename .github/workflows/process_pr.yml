# Checks every pull request into main. Branch protection requires the final job,
# process_pr_result, which passes only when every other job passed. Nothing here deploys.
#
#   lint         gofmt, go vet, staticcheck; JS syntax and catalog format; Python syntax; workflow lint
#   unit         go build + go test; the physics suite over every demo clip; bundles reproducible
#   integration  real server against Postgres: the database tests, compose.yml started as on a new
#                machine, a release image built and deployed with deploy.sh, and each browser suite in
#                test/browser driven through headless Firefox, one job per suite, in parallel
#   screenshots  pictures of the pages and demos, pushed to the ci-screenshots branch
#   docs         Markdown links and the front matter of the Claude Code files
#   pr_summary   one sticky comment on the PR with the results and the size of the change
#
# Only what a change can affect runs. `changes` lists the changed files and test/ci-plan.sh turns
# them into a plan: which of lint, unit and screenshots to run, and which integration suites. A
# documentation-only PR runs the docs job alone; a change to one browser test runs that suite; a
# change to main.go, to this file, or to a path no rule knows runs everything. process_pr_result
# accepts a skipped job only when the plan said it was not needed.
name: process_pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to the same PR cancels the run for the old commit.
concurrency:
  group: process_pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -e and -o pipefail, so a failure under tee still fails the step

env:
  NODE_VERSION: 24

jobs:
  # Does the PR change anything but documentation? Workflow files count as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.plan.outputs.code }}
      lint: ${{ steps.plan.outputs.lint }}
      unit: ${{ steps.plan.outputs.unit }}
      screenshots: ${{ steps.plan.outputs.screenshots }}
      suites: ${{ steps.plan.outputs.suites }}
      postgres: ${{ steps.db.outputs.image }}
    steps:
      # The PR title becomes the squash commit on main, which cliff.toml reads for the next version,
      # so it must be a Conventional Commits title (types in CLAUDE.md). Renamed? Re-run the checks.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::The title '$TITLE' is not a Conventional Commits title. Use 'type(scope): summary', for example 'fix(server): count each visitor behind a proxy'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert."
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::The title is ${#TITLE} characters; keep it under 72 (CLAUDE.md asks for under 70)."
            exit 1
          fi
          echo "title ok: $TITLE"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Plan the jobs from the changed files
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "not a pull request: everything runs"
            test/ci-plan.sh --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          printf 'changed files:\n%s\n\n' "$changed"
          printf '%s\n' "$changed" | test/ci-plan.sh | tee -a "$GITHUB_OUTPUT"
      # The jobs that need a database start it from the image compose.yml pins, by version and digest:
      # the checks run on the Postgres that is deployed, and a pull request that moves the pin is
      # tested on the image it moves to. An image that is not pinned fails here.
      - name: The Postgres the checks run on
        id: db
        run: echo "image=$(test/db-image.sh)" | tee -a "$GITHUB_OUTPUT"

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Markdown links and Claude Code files
        run: test/docs.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the release notes preview reads every commit and tag
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The version release_tag would pick if this pull request were merged, and the notes, from
      # cliff.toml. A broken cliff.toml fails here, before it can break a release. Keep the git-cliff
      # version the same as GIT_CLIFF_VERSION in release_tag.yml.
      - name: Release notes preview (git-cliff)
        run: |
          pipx install "git-cliff==2.14.2"
          next=$(git-cliff --bumped-version)
          [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::git-cliff gave '$next', not a version like v1.2.3"; exit 1; }
          git-cliff --unreleased --tag "$next" --strip all > notes.md
          [ -s notes.md ] || { echo "::error::git-cliff wrote no release notes"; exit 1; }
          cat notes.md
          { echo "### If released now: $next"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "::error::not gofmt-ed:"; echo "$bad"; gofmt -d .; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: JavaScript syntax
        run: |
          for f in sim/*.js web/*.js test/*.js; do node --check "$f"; done
      - name: Catalog format
        run: |
          node test/catalog.js web/catalog/*.json
          node test/catalog-fixtures/check.js   # the Go validator runs on the same files in go test
      - name: Badge keys the server accepts match the page
        run: node test/badges.js
      # The page reads a link the way the server does (the Go test runs the same fixtures).
      - name: Link reading matches the server
        run: node test/links.js
      - name: Merging progress from two devices
        run: node test/merge.js
      # An admin can only switch a feature the Features page lists.
      - name: Feature switches on the page match the server
        run: node test/flags.js
      - name: Python syntax
        run: python3 -m py_compile test/browser/*.py
      # shellcheck ships with the runner image; errors fail the build, style notes do not.
      - name: Shell scripts
        run: shellcheck -S error deploy.sh backup.sh test/browser/run.sh test/docs.sh test/ci-plan.sh test/sleeps.sh test/slowest.sh test/compose.sh test/db-image.sh build-image.sh test/release.sh
      # What compose.yml resolves to, without starting anything: the app published on this machine only
      # unless FLOWA_BIND says otherwise, the database not at all, and with FLOWA_DOMAIN the name answered
      # and only the proxy's network believed. The compose suite asks running containers.
      - name: compose.yml says who can reach the app
        run: test/compose.sh
      - name: The rules that choose which jobs run
        run: test/ci-plan.sh --self-test
      - name: Reading the pinned Postgres image from compose.yml
        run: test/db-image.sh --self-test
      # A browser test waits for what it checks (wait_for, idle and check in test/browser/h.py). A sleep is
      # allowed only with "# fixed: why" on its line, for a time nothing on the page can report.
      - name: No browser test sleeps without a reason
        run: |
          test/sleeps.sh --self-test
          test/sleeps.sh
      - name: The slowest checks table builds from examples
        run: test/slowest.sh --self-test

      - name: Workflow files
        uses: raven-actions/actionlint@v2

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    outputs:
      physics: ${{ steps.physics.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tour/package-lock.json
            figure/package-lock.json

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: go test
        run: go test -race -count=1 ./...

      - name: Physics and anatomy of every demo clip
        id: physics
        run: |
          node test/physics.js | tee physics.txt || code=$?
          echo "line=$(grep -E '^[0-9]+ clips, problems' physics.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Upload physics report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: physics-report
          path: physics.txt
          retention-days: 7

      - name: Geometry of the clips
        run: |
          node test/geometry.js
          node test/suggest.js
          node test/suggest-gate.js
          node sim/features.js
          git diff --exit-code --stat web/clips/features.json || {
            echo "::error::web/clips/features.json is stale; run node sim/features.js and commit"; exit 1; }
      # Body presets keep each move's shape, sticker poses pass the body checks, avatar colours read
      # on both themes, the 3D figure stays within its download size, and, posed in Node as in the
      # browser, no prop is drawn into its body on any clip and every avatar part shows.
      - name: Avatars, body presets and stickers
        run: |
          node test/presets.js
          node test/stickers.js
          node test/avatar-colors.js
          node test/bundle-size.js
          (cd figure && npm ci --silent)
          node test/body3d.js
      # web/ is embedded in the binary, so the committed bundles must be the ones the sources build.
      - name: Bundles are up to date
        run: |
          (cd tour && npm ci --silent && npm run --silent build)
          (cd figure && npm ci --silent && npm run --silent build)
          git diff --exit-code --stat web/tour.js web/figure3d.js || {
            echo "::error::web/tour.js or web/figure3d.js is stale; run npm run build in tour/ and figure/ and commit"; exit 1; }

  # One job per suite, in parallel; each has its own Postgres and server. fail-fast is off so
  # every suite reports, not only the first to fail.
  integration:
    name: integration (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.suites != '[]' && needs.changes.outputs.suites != ''
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres }}   # the image compose.yml pins
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      # deploy.sh --build, which the release suite runs, bakes the demo clips with Node.
      - uses: actions/setup-node@v5
        if: matrix.suite == 'release'
        with:
          node-version: ${{ env.NODE_VERSION }}
      # db: the Go tests that need Postgres (db_test.go), each in its own schema. compose: the two
      # containers of compose.yml, built and started on this runner (test/compose.sh --up). release: the
      # release image pushed to a registry on this runner and deployed from it (test/release.sh).
      # Neither uses the Postgres service above. Every other suite is a test/browser script. Headless
      # Firefox only gets WebGL (software, llvmpipe) when a display exists, so they run under Xvfb;
      # without it the 3D figure cannot be tested.
      - name: Run the ${{ matrix.suite }} suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p report
          if [ "$SUITE" = db ]; then
            TEST_DATABASE_URL="$DATABASE_URL" go test -race -count=1 -run DB -v ./... | tee report/result.txt || code=$?
            echo "$(grep -c -- '^--- PASS' report/result.txt) passed, $(grep -c -- '^--- FAIL' report/result.txt) failed, $(grep -c -- '^--- SKIP' report/result.txt) skipped" > report/line.txt
            cat report/line.txt
            exit "${code:-0}"
          fi
          if [ "$SUITE" = compose ] || [ "$SUITE" = release ]; then
            script=(test/compose.sh --up); [ "$SUITE" = release ] && script=(test/release.sh)
            "${script[@]}" | tee report/result.txt || code=$?
            cp report/result.txt report/out.txt   # its TIME lines, for the slowest checks table
            grep -E '^[0-9]+ passed, ' report/result.txt | tail -1 > report/line.txt || true
            exit "${code:-0}"
          fi
          case "$SUITE" in
            # The server asks a stand-in for Instagram, TikTok and YouTube (test/browser/stub.py), never the real sites.
            links) export FLOWA_PREVIEW_BASE=http://127.0.0.1:3199; file=links.py ;;
            # The frame budget (33 ms for one demo frame with the heaviest avatar) is for this runner's
            # software WebGL; a Pi is slower and sets FRAME_BUDGET_MS when it runs the suite.
            avatar) export FRAME_BUDGET_MS=33; file=avatar.py ;;
            # Demos and combos again with avatars on.
            demos-avatars) export FLOWA_AVATARS=1; file=demos.py ;;
            combo-avatars) export FLOWA_AVATARS=1; file=combo.py ;;
            *) file="$SUITE.py" ;;
          esac
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh "$file" | tee report/result.txt || code=$?
          [ "$SUITE" = avatar ] && { grep -E '^demo frame|^parts' /tmp/flowa-test/out.txt || true; }
          grep -E '^[0-9]+ passed, ' report/result.txt | tail -1 > report/line.txt || true
          exit "${code:-0}"
      - name: Collect logs
        if: ${{ !cancelled() }}
        run: cp /tmp/flowa-test/out.txt /tmp/flowa-test/dev.log report/ 2>/dev/null || true
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: integration-${{ matrix.suite }}
          path: report
          retention-days: 7

  # Pictures of the main pages and a sheet of demos, taken in headless Firefox against the
  # real server. They go to the ci-screenshots branch (same-repo PRs only; the token for a fork
  # PR cannot push) and the PR summary shows them inline.
  screenshots:
    name: screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    permissions:
      contents: write
    services:
      postgres:
        image: ${{ needs.changes.outputs.postgres }}   # the image compose.yml pins
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/postgres?sslmode=disable
    outputs:
      base: ${{ steps.publish.outputs.base }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Pillow
        # run.sh starts Python with -I, which ignores user site-packages, so install it system-wide.
        run: sudo python3 -m pip install --quiet --break-system-packages pillow
      - name: Take the screenshots
        env:
          FLOWA_PREVIEW_BASE: http://127.0.0.1:3199
        run: xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh pages.py "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
      - name: Publish to the ci-screenshots branch
        id: publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SHOTS: ${{ runner.temp }}/shots
        run: |
          set -u
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          d="$RUNNER_TEMP/ci-screenshots"
          if ! git clone -q --depth 1 --branch ci-screenshots "$url" "$d" 2>/dev/null; then
            mkdir -p "$d"; git -C "$d" init -q -b ci-screenshots; git -C "$d" remote add origin "$url"
            printf '# CI screenshots\n\nWritten by the process_pr workflow: one folder per pull request, replaced on every run.\nNothing here is deployed.\n' > "$d/README.md"
          fi
          git -C "$d" config user.name github-actions[bot]
          git -C "$d" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          dir="pr-$PR/${SHA:0:7}"
          rm -rf "$d/pr-$PR"; mkdir -p "$d/$dir"; cp "$SHOTS"/*.png "$SHOTS"/index.json "$d/$dir/"
          git -C "$d" add -A
          git -C "$d" commit -q -m "PR #$PR at ${SHA:0:7}"
          # Another PR may have pushed meanwhile: rebase and try again a few times.
          for i in 1 2 3 4; do
            git -C "$d" push -q origin ci-screenshots && break
            git -C "$d" fetch -q origin ci-screenshots
            if ! git -C "$d" rebase -q origin/ci-screenshots; then git -C "$d" rebase --abort; exit 1; fi
            sleep $((i * 2))
          done
          echo "base=https://github.com/$REPO/blob/ci-screenshots/$dir" >> "$GITHUB_OUTPUT"

  pr_summary:
    name: PR summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, docs, lint, unit, integration, screenshots]
    # Not on a cancelled run: a newer commit's run owns the comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Size of the change
        id: size
        run: |
          base=${{ github.event.pull_request.base.sha }}
          echo "stat=$(git diff --shortstat "$base"...HEAD | sed 's/^ *//')" >> "$GITHUB_OUTPUT"
          # Into a file first: with pipefail, `git diff | head` fails with SIGPIPE on a diff of more than 60 files.
          git diff --stat=100 "$base"...HEAD > files.txt
          { echo 'files<<EOF'; head -60 files.txt; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Fetch the screenshot index
        if: needs.screenshots.outputs.base != ''
        uses: actions/download-artifact@v5
        with:
          name: screenshots
          path: shots
      - name: Fetch the integration results
        if: needs.changes.outputs.suites != '[]' && needs.changes.outputs.suites != ''
        continue-on-error: true   # a suite that never started has no results; the table says n/a
        uses: actions/download-artifact@v5
        with:
          pattern: integration-*
          path: results
      - name: Integration detail
        id: integ
        env:
          SUITES: ${{ needs.changes.outputs.suites }}
        run: |
          detail=""
          for s in $(echo "${SUITES:-[]}" | jq -r '.[]'); do
            line=$(cat "results/integration-$s/line.txt" 2>/dev/null || true)
            detail+="${detail:+; }$s: ${line:-n/a}"
          done
          echo "detail=${detail:-none needed}" >> "$GITHUB_OUTPUT"
          # Where the suites' time went: a check's seconds run from the check before it (test/slowest.sh).
          test/slowest.sh results > slowest.md
      - name: Screenshot gallery
        id: shots
        env:
          BASE: ${{ needs.screenshots.outputs.base }}
          RESULT: ${{ needs.screenshots.result }}
          WANTED: ${{ needs.changes.outputs.screenshots }}
        run: |
          {
            echo 'md<<EOF'
            if [ "$WANTED" != true ]; then
              echo '_No screenshots: nothing that is drawn changed._'
            elif [ -n "$BASE" ] && [ -f shots/index.json ]; then
              echo '### Screenshots'
              echo
              echo 'Taken in headless Firefox on this commit, with the 3D figure drawn in software. Click a name to open it.'
              echo
              jq -r --arg b "$BASE" '.[] | "<details" + (if (.file|test("^(combos|demos)\\.png$")) then " open" else "" end) + "><summary><b>" + .title + "</b></summary>\n\n<img src=\"" + $b + "/" + .file + "?raw=true\" width=\"" + (if (.file|test("phone")) then "360" else "900" end) + "\">\n\n</details>"' shots/index.json
            elif [ "$RESULT" = success ]; then
              echo '_Screenshots were taken (see the run artifacts) but are not published for a pull request from a fork._'
            else
              echo "_Screenshots: job $RESULT._"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Write summary
        id: md
        env:
          SHOTS_MD: ${{ steps.shots.outputs.md }}
          SCREENS: ${{ needs.screenshots.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PLAN: ${{ toJSON(needs.changes.outputs) }}
          DOCS: ${{ needs.docs.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          INTEG: ${{ needs.integration.result }}
          PHYSICS: ${{ needs.unit.outputs.physics }}
          INTEG_DETAIL: ${{ steps.integ.outputs.detail }}
          STAT: ${{ steps.size.outputs.stat }}
          FILES: ${{ steps.size.outputs.files }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # icon <result> <plan key>: a skipped job the plan did not need reads "not needed".
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; cancelled) echo "⚪ cancelled";; *)
            if [ -n "${2:-}" ] && [ "$(echo "$PLAN" | jq -r --arg k "$2" 'if $k == "suites" then (.suites // "[]" | fromjson | length > 0) else .[$k] == "true" end')" = false ]; then echo "➖ not needed"; else echo "⏭️ skipped"; fi;; esac; }
          {
            echo '<!-- process_pr summary -->'
            echo "## process_pr · \`${SHA:0:7}\`"
            echo
            [ "$CODE" = false ] && echo '_Documentation only: no code changed, so the lint, test and screenshot jobs were not needed._' && echo
            [ "$CODE" = true ] && echo "_Ran what this change can affect: integration suites $(echo "$PLAN" | jq -r '.suites // "[]" | fromjson | if length == 0 then "none" else join(", ") end')._" && echo
            echo '| Job | Result | Detail |'
            echo '| --- | --- | --- |'
            echo "| docs | $(icon "$DOCS") | Markdown links, Claude Code front matter |"
            echo "| lint | $(icon "$LINT" lint) | gofmt, go vet, staticcheck, JS/Python syntax, catalogs, actionlint |"
            echo "| unit tests | $(icon "$UNIT" unit) | ${PHYSICS:-go build, go test, physics suite, bundles} |"
            echo "| integration tests | $(icon "$INTEG" suites) | $INTEG_DETAIL |"
            echo "| screenshots | $(icon "$SCREENS" screenshots) | pages at desktop and phone width, demo sheet |"
            echo
            if [ -s slowest.md ]; then
              echo '**Slowest checks** (seconds, each counted from the check before it):'
              echo
              cat slowest.md
              echo
            fi
            echo "$SHOTS_MD"
            echo
            echo "**Change:** ${STAT:-no diff}"
            echo
            echo '<details><summary>Files</summary>'
            echo
            echo '```'
            echo "$FILES"
            echo '```'
            echo '</details>'
            echo
            echo "[Run log]($RUN) · merge is gated on \`process_pr_result\`."
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        uses: actions/github-script@v8
        # Pull requests from forks get a read-only token; the step summary still has the report.
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const marker = '<!-- process_pr summary -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # The single check branch protection requires. It fails if any job above failed or was
  # cancelled, or was skipped though the plan needed it, so a broken or missing job can never let
  # a PR through.
  process_pr_result:
    name: process_pr_result
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [changes, docs, lint, unit, integration, screenshots, pr_summary]
    if: always()
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # pr_summary is informational and does not run on workflow_dispatch. A job may be skipped
          # only when the plan from `changes` did not need it; `changes` and `docs` must always pass.
          # A job the gate does not know is needed (null is not false).
          bad=$(echo "$RESULTS" | jq -r '(.changes.outputs // {}) as $p
            | {changes: true, docs: true, lint: ($p.lint == "true"), unit: ($p.unit == "true"),
               integration: (($p.suites // "[]") | fromjson | length > 0), screenshots: ($p.screenshots == "true")} as $need
            | to_entries[]
            | select(.key != "pr_summary")
            | select(.value.result != "success")
            | select(.value.result != "skipped" or $need[.key] != false)
            | .key')
          if [ -n "$bad" ]; then echo "::error::failed, cancelled, or skipped though needed: $bad"; exit 1; fi
          echo "every needed job passed; plan: $(echo "$RESULTS" | jq -c '.changes.outputs')"
