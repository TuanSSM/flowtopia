# Checks every pull request into main. Branch protection requires the final job,
# process_pr_result, which passes only when every other job passed. Nothing here deploys.
#
#   lint         gofmt, go vet, staticcheck; JS syntax and catalog format; Python syntax; workflow lint
#   unit         go build + go test; the physics suite over every demo clip; bundles reproducible
#   integration  real server against Postgres, driven through headless Firefox (test/browser:
#                combos, demos, and the timeline, profiles, notifications and achievements)
#   screenshots  pictures of the pages and demos, pushed to the ci-screenshots branch
#   docs         Markdown links and the front matter of the Claude Code files
#   pr_summary   one sticky comment on the PR with the results and the size of the change
#
# A pull request that touches no code (Markdown, docs/, .claude/, .gitignore, LICENSE) runs only
# the docs job: `changes` decides, the code jobs are skipped, and process_pr_result accepts the
# skips in that case only, so such a PR can still auto-merge on the required check.
name: process_pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to the same PR cancels the run for the old commit.
concurrency:
  group: process_pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # -e and -o pipefail, so a failure under tee still fails the step

env:
  NODE_VERSION: 24

jobs:
  # Does the PR change anything but documentation? Workflow files count as code.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.classify.outputs.code }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      # The PR title becomes the squash commit on main, which cliff.toml reads for the next version,
      # so it must be a Conventional Commits title (types in CLAUDE.md). Renamed? Re-run the checks.
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*[^.]$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::The title '$TITLE' is not a Conventional Commits title. Use 'type(scope): summary', for example 'fix(server): count each visitor behind a proxy'. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert."
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::The title is ${#TITLE} characters; keep it under 72 (CLAUDE.md asks for under 70)."
            exit 1
          fi
          echo "title ok: $TITLE"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; echo "files=0" >> "$GITHUB_OUTPUT"; echo "not a pull request: everything runs"; exit 0; fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          # Documentation: anything matching every pattern here is not code.
          code=$(printf '%s\n' "$changed" | grep -vE '(^|/)[^/]+\.md$|^docs/|^\.claude/|^\.gitignore$|^\.editorconfig$|^LICENSE$' || true)
          printf 'changed files:\n%s\n' "$changed"
          if [ -n "$code" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; printf 'code files:\n%s\n' "$code"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "documentation only: the code jobs are skipped"; fi
          echo "files=$(printf '%s\n' "$changed" | grep -c .)" >> "$GITHUB_OUTPUT"

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Markdown links and Claude Code files
        run: test/docs.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the release notes preview reads every commit and tag
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The version release_tag would pick if this pull request were merged, and the notes, from
      # cliff.toml. A broken cliff.toml fails here, before it can break a release. Keep the git-cliff
      # version the same as GIT_CLIFF_VERSION in release_tag.yml.
      - name: Release notes preview (git-cliff)
        run: |
          pipx install "git-cliff==2.14.2"
          next=$(git-cliff --bumped-version)
          [[ "$next" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::git-cliff gave '$next', not a version like v1.2.3"; exit 1; }
          git-cliff --unreleased --tag "$next" --strip all > notes.md
          [ -s notes.md ] || { echo "::error::git-cliff wrote no release notes"; exit 1; }
          cat notes.md
          { echo "### If released now: $next"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then echo "::error::not gofmt-ed:"; echo "$bad"; gofmt -d .; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: JavaScript syntax
        run: |
          for f in sim/*.js web/*.js test/*.js; do node --check "$f"; done
      - name: Catalog format
        run: |
          node test/catalog.js web/catalog/*.json
          node test/catalog-fixtures/check.js   # the Go validator runs on the same files in go test
      - name: Badge keys the server accepts match the page
        run: node test/badges.js
      - name: Python syntax
        run: python3 -m py_compile test/browser/*.py
      # shellcheck ships with the runner image; errors fail the build, style notes do not.
      - name: Shell scripts
        run: shellcheck -S error deploy.sh backup.sh test/browser/run.sh test/docs.sh

      - name: Workflow files
        uses: raven-actions/actionlint@v2

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      physics: ${{ steps.physics.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            tour/package-lock.json
            figure/package-lock.json

      - name: go build
        run: CGO_ENABLED=0 go build -trimpath ./...
      - name: go test
        run: go test -race -count=1 ./...

      - name: Physics and anatomy of every demo clip
        id: physics
        run: |
          node test/physics.js | tee physics.txt || code=$?
          echo "line=$(grep -E '^[0-9]+ clips, problems' physics.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Upload physics report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: physics-report
          path: physics.txt
          retention-days: 7

      - name: Geometry of the clips
        run: |
          node test/geometry.js
          node test/suggest.js
          node test/suggest-gate.js
          node sim/features.js
          git diff --exit-code --stat web/clips/features.json || {
            echo "::error::web/clips/features.json is stale; run node sim/features.js and commit"; exit 1; }
      # Body presets keep each move's shape, sticker poses pass the body checks, avatar colours read
      # on both themes, and the 3D figure stays within its download size.
      - name: Avatars, body presets and stickers
        run: |
          node test/presets.js
          node test/stickers.js
          node test/avatar-colors.js
          node test/bundle-size.js
      # web/ is embedded in the binary, so the committed bundles must be the ones the sources build.
      - name: Bundles are up to date
        run: |
          (cd tour && npm ci --silent && npm run --silent build)
          (cd figure && npm ci --silent && npm run --silent build)
          git diff --exit-code --stat web/tour.js web/figure3d.js || {
            echo "::error::web/tour.js or web/figure3d.js is stale; run npm run build in tour/ and figure/ and commit"; exit 1; }

  integration:
    name: integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.code == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/postgres?sslmode=disable
    outputs:
      combo: ${{ steps.combo.outputs.line }}
      demos: ${{ steps.demos.outputs.line }}
      social: ${{ steps.social.outputs.line }}
      mod: ${{ steps.mod.outputs.line }}
      editor: ${{ steps.editor.outputs.line }}
      links: ${{ steps.links.outputs.line }}
      suggest: ${{ steps.suggest.outputs.line }}
      avatars: ${{ steps.avatars.outputs.line }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable   # what the Pi builds with; go.mod only sets the language version
      # Headless Firefox only gets WebGL (software, llvmpipe) when a display exists, so the
      # browser tests run under Xvfb; without it the 3D figure cannot be tested.
      - name: Firefox
        run: firefox --version

      # Go tests that need Postgres (db_test.go); each runs in its own schema, so the browser
      # tests below still start from an empty public schema.
      - name: Database tests
        run: TEST_DATABASE_URL="$DATABASE_URL" go test -race -count=1 -run DB -v ./... | tee dbtests.txt
      - name: Combo builder
        id: combo
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh combo.py | tee combo.txt || code=$?
          echo "line=$(grep -E 'passed' combo.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Demos and 3D figure
        id: demos
        if: always()
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh demos.py | tee demos.txt || code=$?
          echo "line=$(grep -E 'passed' demos.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Timeline, profiles, notifications and achievements
        id: social
        if: always()
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh social.py | tee social.txt || code=$?
          echo "line=$(grep -E 'passed' social.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Moderation, roles and the admin dashboard
        id: mod
        if: always()
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh mod.py | tee mod.txt || code=$?
          echo "line=$(grep -E 'passed' mod.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Skill map editor
        id: editor
        if: always()
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh editor.py | tee editor.txt || code=$?
          echo "line=$(grep -E 'passed' editor.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Next-trick suggestions
        id: suggest
        if: always()
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh suggest.py | tee suggest.txt || code=$?
          echo "line=$(grep -E 'passed' suggest.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      # The server asks a stand-in for Instagram, TikTok and YouTube (test/browser/stub.py), never the real sites.
      - name: Link cards
        id: links
        if: always()
        env:
          FLOWA_PREVIEW_BASE: http://127.0.0.1:3199
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh links.py | tee links.txt || code=$?
          echo "line=$(grep -E 'passed' links.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      # The frame budget (33 ms for one demo frame with the heaviest avatar) is for this runner's
      # software WebGL; a Pi is slower and sets FRAME_BUDGET_MS when it runs the suite.
      - name: Avatars
        id: avatars
        if: always()
        env:
          FRAME_BUDGET_MS: "33"
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh avatar.py | tee avatars.txt || code=$?
          grep -E '^demo frame|^parts' /tmp/flowa-test/out.txt || true
          echo "line=$(grep -E 'passed' avatars.txt | tail -1)" >> "$GITHUB_OUTPUT"
          exit "${code:-0}"
      - name: Demos and combos with avatars on
        if: always()
        env:
          FLOWA_AVATARS: "1"
        run: |
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh demos.py | tee demos-avatars.txt || code=$?
          xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh combo.py | tee combo-avatars.txt || code=$?
          exit "${code:-0}"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-logs
          path: |
            /tmp/flowa-test/out.txt
            /tmp/flowa-test/dev.log
            combo.txt
            demos.txt
            social.txt
            dbtests.txt
            mod.txt
            editor.txt
            links.txt
            suggest.txt
            avatars.txt
            demos-avatars.txt
            combo-avatars.txt
          retention-days: 7

  # Pictures of the main pages and a sheet of demos, taken in headless Firefox against the
  # real server. They go to the ci-screenshots branch (same-repo PRs only; the token for a fork
  # PR cannot push) and the PR summary shows them inline.
  screenshots:
    name: screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:55432/postgres?sslmode=disable
    outputs:
      base: ${{ steps.publish.outputs.base }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Pillow
        # run.sh starts Python with -I, which ignores user site-packages, so install it system-wide.
        run: sudo python3 -m pip install --quiet --break-system-packages pillow
      - name: Take the screenshots
        env:
          FLOWA_PREVIEW_BASE: http://127.0.0.1:3199
        run: xvfb-run -a -s "-screen 0 1440x1000x24" test/browser/run.sh pages.py "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 14
      - name: Publish to the ci-screenshots branch
        id: publish
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SHOTS: ${{ runner.temp }}/shots
        run: |
          set -u
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          d="$RUNNER_TEMP/ci-screenshots"
          if ! git clone -q --depth 1 --branch ci-screenshots "$url" "$d" 2>/dev/null; then
            mkdir -p "$d"; git -C "$d" init -q -b ci-screenshots; git -C "$d" remote add origin "$url"
            printf '# CI screenshots\n\nWritten by the process_pr workflow: one folder per pull request, replaced on every run.\nNothing here is deployed.\n' > "$d/README.md"
          fi
          git -C "$d" config user.name github-actions[bot]
          git -C "$d" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          dir="pr-$PR/${SHA:0:7}"
          rm -rf "$d/pr-$PR"; mkdir -p "$d/$dir"; cp "$SHOTS"/*.png "$SHOTS"/index.json "$d/$dir/"
          git -C "$d" add -A
          git -C "$d" commit -q -m "PR #$PR at ${SHA:0:7}"
          # Another PR may have pushed meanwhile: rebase and try again a few times.
          for i in 1 2 3 4; do
            git -C "$d" push -q origin ci-screenshots && break
            git -C "$d" fetch -q origin ci-screenshots
            if ! git -C "$d" rebase -q origin/ci-screenshots; then git -C "$d" rebase --abort; exit 1; fi
            sleep $((i * 2))
          done
          echo "base=https://github.com/$REPO/blob/ci-screenshots/$dir" >> "$GITHUB_OUTPUT"

  pr_summary:
    name: PR summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, docs, lint, unit, integration, screenshots]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Size of the change
        id: size
        run: |
          base=${{ github.event.pull_request.base.sha }}
          echo "stat=$(git diff --shortstat "$base"...HEAD | sed 's/^ *//')" >> "$GITHUB_OUTPUT"
          { echo 'files<<EOF'; git diff --stat=100 "$base"...HEAD | head -60; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Fetch the screenshot index
        if: needs.screenshots.outputs.base != ''
        uses: actions/download-artifact@v5
        with:
          name: screenshots
          path: shots
      - name: Screenshot gallery
        id: shots
        env:
          BASE: ${{ needs.screenshots.outputs.base }}
          RESULT: ${{ needs.screenshots.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          {
            echo 'md<<EOF'
            if [ "$CODE" = false ]; then
              echo '_No screenshots: nothing that is drawn changed._'
            elif [ -n "$BASE" ] && [ -f shots/index.json ]; then
              echo '### Screenshots'
              echo
              echo 'Taken in headless Firefox on this commit, with the 3D figure drawn in software. Click a name to open it.'
              echo
              jq -r --arg b "$BASE" '.[] | "<details" + (if (.file|test("^(combos|demos)\\.png$")) then " open" else "" end) + "><summary><b>" + .title + "</b></summary>\n\n<img src=\"" + $b + "/" + .file + "?raw=true\" width=\"" + (if (.file|test("phone")) then "360" else "900" end) + "\">\n\n</details>"' shots/index.json
            elif [ "$RESULT" = success ]; then
              echo '_Screenshots were taken (see the run artifacts) but are not published for a pull request from a fork._'
            else
              echo "_Screenshots: job $RESULT._"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Write summary
        id: md
        env:
          SHOTS_MD: ${{ steps.shots.outputs.md }}
          SCREENS: ${{ needs.screenshots.result }}
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.docs.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          INTEG: ${{ needs.integration.result }}
          PHYSICS: ${{ needs.unit.outputs.physics }}
          COMBO: ${{ needs.integration.outputs.combo }}
          DEMOS: ${{ needs.integration.outputs.demos }}
          SOCIAL: ${{ needs.integration.outputs.social }}
          MODS: ${{ needs.integration.outputs.mod }}
          EDITOR: ${{ needs.integration.outputs.editor }}
          LINKS: ${{ needs.integration.outputs.links }}
          SUGGEST: ${{ needs.integration.outputs.suggest }}
          AVATARS: ${{ needs.integration.outputs.avatars }}
          STAT: ${{ steps.size.outputs.stat }}
          FILES: ${{ steps.size.outputs.files }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          icon() { case "$1" in success) echo "✅ passed";; failure) echo "❌ failed";; cancelled) echo "⚪ cancelled";; skipped) [ "$CODE" = false ] && echo "➖ not needed" || echo "⏭️ skipped";; *) echo "⏭️ skipped";; esac; }
          {
            echo '<!-- process_pr summary -->'
            echo "## process_pr · \`${SHA:0:7}\`"
            echo
            [ "$CODE" = false ] && echo '_Documentation only: no code changed, so the lint, test and screenshot jobs were not needed._' && echo
            echo '| Job | Result | Detail |'
            echo '| --- | --- | --- |'
            echo "| docs | $(icon "$DOCS") | Markdown links, Claude Code front matter |"
            echo "| lint | $(icon "$LINT") | gofmt, go vet, staticcheck, JS/Python syntax, catalogs, actionlint |"
            echo "| unit tests | $(icon "$UNIT") | ${PHYSICS:-go build, go test, physics suite, bundles} |"
            echo "| integration tests | $(icon "$INTEG") | combo: ${COMBO:-n/a}; demos: ${DEMOS:-n/a}; community: ${SOCIAL:-n/a}; moderation: ${MODS:-n/a}; editor: ${EDITOR:-n/a}; links: ${LINKS:-n/a}; suggestions: ${SUGGEST:-n/a}; avatars: ${AVATARS:-n/a} |"
            echo "| screenshots | $(icon "$SCREENS") | pages at desktop and phone width, demo sheet |"
            echo
            echo "$SHOTS_MD"
            echo
            echo "**Change:** ${STAT:-no diff}"
            echo
            echo '<details><summary>Files</summary>'
            echo
            echo '```'
            echo "$FILES"
            echo '```'
            echo '</details>'
            echo
            echo "[Run log]($RUN) · merge is gated on \`process_pr_result\`."
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        uses: actions/github-script@v8
        # Pull requests from forks get a read-only token; the step summary still has the report.
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const marker = '<!-- process_pr summary -->';
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  # The single check branch protection requires. It fails if any job above failed, was
  # cancelled or was skipped, so a broken or missing job can never let a PR through.
  process_pr_result:
    name: process_pr_result
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [changes, docs, lint, unit, integration, screenshots, pr_summary]
    if: always()
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # pr_summary is informational and does not run on workflow_dispatch. The code jobs may be
          # skipped only when `changes` found no code; `changes` and `docs` must always pass.
          bad=$(echo "$RESULTS" | jq -r --arg code "$CODE" 'to_entries[]
            | select(.key != "pr_summary")
            | select(.value.result != "success")
            | select(.value.result != "skipped" or $code != "false" or (.key == "changes" or .key == "docs"))
            | .key')
          if [ -n "$bad" ]; then echo "::error::failed or skipped: $bad"; exit 1; fi
          [ "$CODE" = false ] && echo "documentation only: docs passed, code jobs not needed" || echo "all checks passed"
