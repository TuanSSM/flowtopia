<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flowa</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<div id="app" class="shell">
  <div class="scrim" data-act="nav-close" aria-hidden="true"></div>
  <!-- The menu is drawn again on every change, into #menu. The note under it that says whether changes are
       saved is a live region, so it is not drawn again with the menu: only its words change. -->
  <nav id="side" class="side" aria-label="Main"><div id="menu" class="side-menu"></div><div id="sync" class="sync" role="status" hidden><span class="dot"></span><span></span></div></nav>
  <div class="content">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="nav-open" aria-label="Open navigation"></button>
      <div id="crumb" class="crumb"></div>
      <div id="bell" class="bell-wrap"></div>
      <button class="search-btn" data-act="palette" aria-label="Search skills and pages"></button>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
  <aside id="panel" class="panel" aria-label="Skill details" hidden></aside>
</div>
<div id="palette" class="palette" hidden></div>
<div id="modal" class="modal" hidden></div>
<!-- Short messages. A screen reader says what is put into a live region it already knows, so these four
     are on the page from the start and are emptied, not hidden, when there is nothing to say. #say holds
     what there is nothing to show for: the room left in a text box, a picture or a tag added to a draft. -->
<div id="unlock" class="unlock" role="status"></div>
<div id="tip" class="tip" role="status"></div>
<div id="toast" class="toast" role="status"></div>
<div id="say" class="say" role="status"></div>
<script src="props.js"></script>
<script src="data.js"></script>
<script src="demo.js"></script>
<script src="catalogs.js"></script>
<script src="account.js"></script>
<script src="game.js"></script>
<script src="links.js"></script>
<script src="merge.js"></script>
<script src="social.js"></script>
<script src="avatar.js"></script>
<script src="suggest.js"></script>
<script src="nexttrick.js"></script>
<script src="mod.js"></script>
<script src="catalog-check.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
