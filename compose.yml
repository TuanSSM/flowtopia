services:
  db:
    # Pinned by version and digest, so a deploy never changes the database by itself. Dependabot opens
    # a pull request when either moves (.github/dependabot.yml), and the checks then run on the new
    # image (test/db-image.sh). Stay on 16: another major version cannot open this data folder.
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: nunchaku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowa
      POSTGRES_DB: flowa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Small settings for a Raspberry Pi that also runs the printer stack.
    command: postgres -c shared_buffers=32MB -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowa -d flowa"]
      interval: 10s
      timeout: 5s
      retries: 12
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Bounds, so a flood of requests cannot take the CPU or memory the printer stack needs.
    cpus: "1.5"
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "2" }

  nunchaku:
    build: .
    image: nunchaku:latest
    container_name: nunchaku
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["3169:3169"]
    user: "1000:1000"
    environment:
      DATABASE_URL: postgres://flowa:${POSTGRES_PASSWORD}@db:5432/flowa?sslmode=disable
      # The admin account is created on first start only. Changing these later does nothing.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Extra names the app answers to, comma-separated (IP addresses, localhost and private
      # names such as raspi or raspi.local always work).
      FLOWA_HOSTS: ${FLOWA_HOSTS:-}
      # How the instance runs. Unset or "local": a community on this server only, as always. "single": one
      # person's own instance. "federated": a community whose members can share their profiles with other
      # servers (this version answers discovery only). Any other word stops the start with a message.
      # A mode that federates needs FLOWA_ORIGIN and FLOWA_KEY_SECRET (README, Federation). FLOWA_FEDERATE
      # is read in single mode only: "on" announces the one profile; unset or "off" (the default) does not.
      FLOWA_MODE: ${FLOWA_MODE:-}
      FLOWA_ORIGIN: ${FLOWA_ORIGIN:-}
      FLOWA_KEY_SECRET: ${FLOWA_KEY_SECRET:-}
      FLOWA_FEDERATE: ${FLOWA_FEDERATE:-}
      # A link for admins to the start page of this machine, in the Staff group of the menu.
      # An http or https address, like http://raspi.local:8080/. Unset: no link.
      FLOWA_HOME_URL: ${FLOWA_HOME_URL:-}
      # Reverse proxies whose X-Forwarded-For is believed, as addresses or ranges, comma-separated;
      # "none" for none. Unset: loopback and Docker networks (127.0.0.0/8, ::1, 172.16.0.0/12).
      FLOWA_TRUSTED_PROXIES: ${FLOWA_TRUSTED_PROXIES:-}
      # Lets the fit_suggest workflow read the shared transition counts without an account: at least
      # 32 characters (openssl rand -hex 32), the same value as the repository secret of that name.
      # The counts name no member. Unset: only a signed-in admin can export them.
      FLOWA_COUNTS_TOKEN: ${FLOWA_COUNTS_TOKEN:-}
      # Shown on the admin dashboard in place of the version compiled into the image (a release's
      # tag, or main.<commit> from deploy.sh --build). Unset: the image says what it is.
      VERSION: ${VERSION:-}
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "2"
    mem_limit: 384m
    pids_limit: 256
    # The log holds one line per request (at most 240 a minute) and the refused sign-ins and used-up
    # allowances (at most 120 a minute). A line takes about 220 bytes on disk, so a flood that uses
    # both to the full writes about 100 MB in a day: 10 files of 10 MB keep a day of the worst case
    # to look back over, and months of ordinary use.
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "10" }

volumes:
  pgdata:
