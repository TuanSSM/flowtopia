services:
  db:
    image: postgres:16-alpine
    container_name: nunchaku-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowa
      POSTGRES_DB: flowa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Small settings for a Raspberry Pi that also runs the printer stack.
    command: postgres -c shared_buffers=32MB -c max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowa -d flowa"]
      interval: 10s
      timeout: 5s
      retries: 12
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Bounds, so a flood of requests cannot take the CPU or memory the printer stack needs.
    cpus: "1.5"
    mem_limit: 384m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "2" }

  nunchaku:
    build: .
    image: nunchaku:latest
    container_name: nunchaku
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ["3169:3169"]
    user: "1000:1000"
    environment:
      DATABASE_URL: postgres://flowa:${POSTGRES_PASSWORD}@db:5432/flowa?sslmode=disable
      # The admin account is created on first start only. Changing these later does nothing.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Extra names the app answers to, comma-separated (IP addresses, localhost and private
      # names such as raspi or raspi.local always work).
      FLOWA_HOSTS: ${FLOWA_HOSTS:-}
      # Reverse proxies whose X-Forwarded-For is believed, as addresses or ranges, comma-separated;
      # "none" for none. Unset: loopback and Docker networks (127.0.0.0/8, ::1, 172.16.0.0/12).
      FLOWA_TRUSTED_PROXIES: ${FLOWA_TRUSTED_PROXIES:-}
    volumes:
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: "2"
    mem_limit: 384m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "2" }

volumes:
  pgdata:
